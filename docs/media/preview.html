<script>
// Hand-authored, fictional demo data. No GitHub requests, account data, or external scripts.
const icons={star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2L5.8 21 7 14.2 2 9.3l6.9-1Z"/>',pause:'<circle cx="12" cy="12" r="9"/><path d="M9 8v8M15 8v8"/>',actions:'<circle cx="12" cy="12" r="9"/><circle cx="7" cy="12" r=".7"/><circle cx="12" cy="12" r=".7"/><circle cx="17" cy="12" r=".7"/>',wifi:'<path d="M2 6a16 16 0 0 1 20 0M5 10a11 11 0 0 1 14 0M9 14a5 5 0 0 1 6 0"/><circle cx="12" cy="18" r="1"/>',battery:'<rect x="2" y="6" width="17" height="12" rx="2"/><path d="M22 10v4M5 9h10v6H5Z"/>',building:'<rect x="4" y="2" width="12" height="20" rx="1"/><path d="M16 9h4v13H4M8 6h1m3 0h1M8 10h1m3 0h1M8 14h1m3 0h1M9 22v-4h3v4"/>',refresh:'<path d="M20 7a8 8 0 1 0 1 9M20 2v6h-6"/>',settings:'<path d="m9 3 1-2h4l1 2 3 2 3 1v4l-2 2 2 2v4l-3 1-3 2-1 2h-4l-1-2-3-2-3-1v-4l2-2-2-2V6l3-1Z"/><circle cx="12" cy="12" r="3"/>',inbox:'<path d="m3 4-2 9v6h22v-6l-3-9ZM1 13h6l2 3h6l2-3h6"/>',send:'<path d="m2 11 20-9-7 20-4-8-9-3ZM11 14 22 2"/>',search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/>',grip:'<path d="M4 6h16M4 12h16M4 18h16"/>',down:'<path d="m6 9 6 6 6-6"/>',folder:'<path d="M2 6h7l2 3h11v12H2ZM2 6V3h7l2 3h11v3"/>',pr:'<circle cx="6" cy="4" r="2"/><circle cx="18" cy="20" r="2"/><path d="M6 6v16M14 4h2a2 2 0 0 1 2 2v12"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',check:'<path d="m4 12 5 5L20 6"/>',comment:'<path d="M3 3h18v14H8l-5 4ZM12 7v4m0 3h0"/>',more:'<circle cx="4" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="20" cy="12" r="1"/>',right:'<path d="m9 5 7 7-7 7"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.clock}</svg>`;
function initIcons(){document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));}
const incomingPRs=[
{repo:'sample-api',n:26,title:'Add pagination to the list endpoint',by:'alex',age:'2 hr. ago',status:'waiting',activity:'new',starred:true},
{repo:'sample-api',n:24,title:'Improve input validation messages',by:'kai',age:'2 hr. ago',status:'approved'},
{repo:'sample-docs',n:16,title:'Expand the setup guide',by:'ren',age:'1 hr. ago',status:'waiting',activity:'new'},
{repo:'sample-docs',n:13,title:'Fix a typo in the code example',by:'sam',age:'1 hr. ago',status:'waiting'},
{repo:'sample-docs',n:9,title:'Reorganize headings and navigation',by:'alex',age:'3 hr. ago',status:'commented'},
{repo:'sample-web',n:35,title:'Fix the empty search state',by:'sam',age:'40 min. ago',status:'rereview',activity:'updated'},
{repo:'sample-web',n:42,title:'Remember the list sort order',by:'alex',age:'20 min. ago',status:'waiting'},
{repo:'sample-web',n:38,title:'Add a loading indicator',by:'kai',age:'1 hr. ago',status:'waiting',pending:true},
{repo:'sample-web',n:29,title:'Improve keyboard focus styles',by:'ren',age:'3 hr. ago',status:'changes'}];
const outgoingPRs=[
{repo:'sample-api',n:19,title:'Add response format tests',by:'you',age:'4 hr. ago',status:'approved'},
{repo:'sample-docs',n:14,title:'Add frequently asked questions',by:'you',age:'4 hr. ago',status:'waiting'},
{repo:'sample-web',n:31,title:'Adjust footer spacing',by:'you',age:'3 hr. ago',status:'changes',activity:'updated',starred:true},
{repo:'sample-web',n:40,title:'Document keyboard navigation',by:'you',age:'3 hr. ago',status:'waiting'}];
let tab='incoming',isOpen=true,activityOnly=false;
const selectedFilters={incoming:'pending',outgoing:'all'},pendingExpanded={incoming:false,outgoing:false};
let repositoryOrder=['sample-api','sample-docs','sample-web'];
const collapsedRepositories=new Set(),visitedTabs=new Set(['incoming']);
const panel=document.getElementById('panel'),trigger=document.getElementById('trigger'),cursor=document.getElementById('cursor');
const sourceFor=id=>id==='incoming'?incomingPRs:outgoingPRs;
function matches(pr,f){return f==='all'||(f==='pending'?['waiting','rereview'].includes(pr.status):f==='done'?!['waiting','rereview'].includes(pr.status):pr.status===f);}
function activityCounts(prs){
 return [['new','New'],['updated','Updated']].map(([kind,label])=>{
  const count=prs.filter(pr=>!pr.pending&&pr.activity===kind).length;
  return count?`${label} ${count}`:'';
 }).filter(Boolean).join(' · ');
}
function renderGroups(prs){
 let content='';
 for(const repo of repositoryOrder.filter(repo=>prs.some(pr=>pr.repo===repo))){
  const group=prs.filter(pr=>pr.repo===repo),collapsed=collapsedRepositories.has(repo),activity=activityCounts(group);
  content+=`<section class="group"><button class="group-header" draggable="true" data-repository="${repo}" aria-expanded="${!collapsed}" title="Click to ${collapsed?'expand':'collapse'}. Drag onto another repository to reorder."><span class="symbol disclosure">${icon(collapsed?'right':'down')}</span><span class="symbol">${icon('folder')}</span><span>${repo}</span>${activity?`<span class="group-activity">${activity}</span>`:''}<span class="repo-count">${group.length}</span><span class="symbol grip">${icon('grip')}</span></button>`;
  for(const pr of collapsed?[]:group){
   const label={waiting:tab==='incoming'?'Not reviewed':'Waiting',rereview:'Re-review requested',changes:tab==='incoming'?'Changes requested':'Changes',approved:'Approved',commented:'Commented'}[pr.status];
   const symbol={waiting:'clock',rereview:'refresh',changes:'comment',approved:'check',commented:'comment'}[pr.status];
   const activity=pr.pending?null:pr.activity;
   content+=`<article class="row ${activity||''}"><div class="row-main"><div class="row-title"><span class="symbol">${icon('pr')}</span><span class="pr-title" title="${pr.title}">#${pr.n}・${pr.title}</span>${activity?`<span class="activity-badge ${activity}">${activity==='new'?'NEW':'Updated'}</span>`:''}<span class="age">${pr.age}</span></div><div class="row-meta">${tab==='incoming'?`<span class="mini-avatar">${pr.by.slice(0,2).toUpperCase()}</span><span>${pr.by}</span>`:`<span class="reviewer">alex <span class="symbol">${icon(pr.status==='changes'?'comment':'check')}</span></span><span class="reviewer">sam <span class="symbol">${icon(pr.status==='approved'?'check':'clock')}</span></span>`}<span class="status ${pr.status}"><span class="symbol">${icon(symbol)}</span>${label}</span>${tab==='outgoing'?`<span class="ci">${pr.status==='changes'?'×':'✓'}</span>`:''}</div></div><button class="star-button" data-star="${pr.n}" aria-pressed="${Boolean(pr.starred)}" aria-label="${pr.starred?'Unstar':'Star'} ${pr.title}" title="${pr.starred?'Unstar PR':'Star PR'}"><span class="symbol">${icon('star')}</span></button><details class="row-actions"><summary aria-label="Actions for ${pr.title}"><span class="symbol">${icon(pr.pending?'pause':'actions')}</span></summary><button class="pending-action" data-pending="${pr.n}">${pr.pending?'Restore to active list':'Move to Pending'}</button></details><span class="symbol row-chevron">${icon('right')}</span></article>`;
  }
  content+='</section>';
 }
 return content;
}
function acknowledge(){
 for(const id of visitedTabs)for(const pr of sourceFor(id))delete pr.activity;
 visitedTabs.clear();
}
function renderHints(){
 document.querySelectorAll('.key-hint').forEach(el=>el.remove());
 const targets=[document.getElementById('incoming'),document.getElementById('outgoing'),
  ...document.querySelectorAll('[data-filter]'),document.querySelector('.search [data-icon=search]'),
  document.getElementById('activity-only'),document.querySelector('.head-actions [data-icon=refresh]'),
  document.querySelector('.head-actions [data-icon=settings]'),
  ...document.querySelectorAll('.list .group-header,.list .row,.list .pending-toggle')];
 const alphabet='ASDFGHJKLQWERTYUIOPZXCVBNM',width=targets.length>alphabet.length?2:1;
 targets.forEach((target,index)=>{
  const hint=document.createElement('kbd');hint.className='key-hint';hint.setAttribute('aria-hidden','true');
  hint.textContent=(width===2?alphabet[Math.floor(index/alphabet.length)]:'')+alphabet[index%alphabet.length];
  if(target.classList.contains('symbol')){
   if(!target.parentElement.classList.contains('hinted-icon')){const wrapper=document.createElement('span');wrapper.className='hinted-icon';target.before(wrapper);wrapper.append(target);}
   target.before(hint);
  }else target.prepend(hint);
 });
}
function render(){
 panel.hidden=!isOpen;panel.inert=!isOpen;panel.setAttribute('aria-hidden',String(!isOpen));trigger.setAttribute('aria-expanded',String(isOpen));
 const reviews=incomingPRs.filter(pr=>!pr.pending&&matches(pr,'pending')).length,changes=outgoingPRs.filter(pr=>!pr.pending&&pr.status==='changes').length;
 const unseen=[...incomingPRs,...outgoingPRs].filter(pr=>!pr.pending&&pr.activity).length;
 trigger.innerHTML=`<span class="brand"></span>${reviews?`<span>↓${reviews}</span>`:''}${reviews&&changes?'<span class="separator">│</span>':''}${changes?`<span>↑${changes}</span>`:''}${unseen?'<span class="unseen-dot" aria-hidden="true"></span>':''}`;
 trigger.setAttribute('aria-label',`PRch: ${reviews} reviews to do, ${changes} PR needing changes, ${unseen} unseen changes`);
 for(const id of ['incoming','outgoing']){
  const button=document.getElementById(id),prs=sourceFor(id).filter(pr=>!pr.pending),unread=prs.filter(pr=>pr.activity).length;
  button.setAttribute('aria-selected',String(tab===id));
  button.querySelector('.count').textContent=prs.filter(pr=>matches(pr,selectedFilters[id])).length;
  button.querySelector('.unread').textContent=unread?`+${unread}`:'';
 }
 const source=sourceFor(tab),active=source.filter(pr=>!pr.pending),pending=source.filter(pr=>pr.pending),filter=selectedFilters[tab];
 const filters=tab==='incoming'?[['pending','Needs review'],['done','Reviewed'],['all','All']]:[['all','All'],['waiting','Waiting'],['changes','Changes'],['approved','Approved'],['unrequested','No request']];
 document.getElementById('filters').innerHTML=filters.map(([id,label])=>`<button class="filter" data-filter="${id}" aria-pressed="${filter===id}">${label}<span class="number">${active.filter(pr=>matches(pr,id)).length}</span></button>`).join('');
 document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{selectedFilters[tab]=button.dataset.filter;render();}));
 document.getElementById('activity-only').setAttribute('aria-pressed',String(activityOnly));
 const summary=activityCounts(active),summaryLabel=document.getElementById('activity-summary');
 summaryLabel.textContent=summary?`Since last visit: ${summary}`:'No new activity';
 summaryLabel.classList.toggle('has-activity',Boolean(summary));
 const prs=active.filter(pr=>matches(pr,filter)&&(!activityOnly||pr.activity));
 const starred=prs.filter(pr=>pr.starred),regular=prs.filter(pr=>!pr.starred);
 let content=starred.length?`<div class="starred-heading" role="heading" aria-level="2" title="Filters still apply. Stars do not change counts or review status."><span class="symbol">${icon('star')}</span>Starred<span>${starred.length}</span></div>${renderGroups(starred)}${regular.length?'<hr class="starred-divider">':''}`:'';
 content+=renderGroups(regular);
 if(pending.length){
  content+=`<section class="pending-section"><button class="pending-toggle" id="pending-toggle" aria-expanded="${pendingExpanded[tab]}" title="Saved on this Mac. Excluded from counts until you restore it. GitHub review status is unchanged."><span class="symbol disclosure">${icon(pendingExpanded[tab]?'down':'right')}</span><span class="symbol">${icon('pause')}</span>Pending<span>${pending.length}</span></button>${pendingExpanded[tab]?renderGroups(pending):''}</section>`;
 }
 document.getElementById('list').innerHTML=content||'<div class="empty">No matching PRs</div>';
 document.getElementById('pending-toggle')?.addEventListener('click',()=>{pendingExpanded[tab]=!pendingExpanded[tab];render();});
 document.querySelectorAll('[data-star]').forEach(button=>button.addEventListener('click',()=>{
  const pr=source.find(pr=>pr.n===Number(button.dataset.star));pr.starred=!pr.starred;render();
 }));
 document.querySelectorAll('[data-pending]').forEach(button=>button.addEventListener('click',()=>{
  const pr=source.find(pr=>pr.n===Number(button.dataset.pending));pr.pending=!pr.pending;delete pr.activity;render();
 }));
 document.querySelectorAll('[data-repository]').forEach(header=>{
  const repo=header.dataset.repository;
  header.addEventListener('click',()=>{if(collapsedRepositories.has(repo))collapsedRepositories.delete(repo);else collapsedRepositories.add(repo);render();});
  header.addEventListener('dragstart',event=>{event.dataTransfer.setData('application/x-prch-repository',repo);event.dataTransfer.effectAllowed='move';});
  header.addEventListener('dragover',event=>{if(event.dataTransfer.types.includes('application/x-prch-repository')){event.preventDefault();event.dataTransfer.dropEffect='move';header.classList.add('drop-target');}});
  header.addEventListener('dragleave',()=>header.classList.remove('drop-target'));
  header.addEventListener('dragend',()=>document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target')));
  header.addEventListener('drop',event=>{event.preventDefault();header.classList.remove('drop-target');const source=event.dataTransfer.getData('application/x-prch-repository'),from=repositoryOrder.indexOf(source),to=repositoryOrder.indexOf(repo);if(from<0||from===to)return;repositoryOrder.splice(from,1);repositoryOrder.splice(to,0,source);render();});
 });
 document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===(!isOpen?'closed':tab==='incoming'?'incoming':filter==='changes'?'changes':'outgoing'))));
 renderHints();align(!isOpen?'closed':tab);
}
function scene(name){
 if(name==='closed')acknowledge();
 activityOnly=false;isOpen=name!=='closed';tab=['outgoing','changes'].includes(name)?'outgoing':'incoming';
 selectedFilters[tab]=name==='changes'?'changes':tab==='incoming'?'pending':'all';
 if(isOpen)visitedTabs.add(tab);
 cursor.hidden=true;render();
}
document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>scene(b.dataset.scene)));
document.getElementById('activity-only').addEventListener('click',()=>{activityOnly=!activityOnly;render();});
trigger.addEventListener('click',()=>{if(isOpen)acknowledge();else visitedTabs.add(tab);isOpen=!isOpen;render();});
for(const id of ['incoming','outgoing'])document.getElementById(id).addEventListener('click',()=>{if(tab===id)return;activityOnly=false;tab=id;visitedTabs.add(tab);render();});
function align(name){const base=document.getElementById('scene').getBoundingClientRect(),scale=base.width/680;const bar=trigger.getBoundingClientRect(),pop=panel.getBoundingClientRect();panel.style.setProperty('--anchor-left',((bar.x+bar.width/2-pop.x)/scale-6)+'px');const target=name==='outgoing'?document.getElementById('outgoing'):name==='changes'?document.querySelector('[data-filter=changes]'):trigger;const r=target.getBoundingClientRect();cursor.style.left=((r.x+r.width*.68-base.x)/scale)+'px';cursor.style.top=((r.y+r.height*.6-base.y)/scale)+'px';}
function fit(){const width=Math.min(680,document.documentElement.clientWidth);document.getElementById('scene').style.transform=`scale(${width/680})`;document.querySelector('.scene-wrap').style.height=(804*width/680)+'px';align(!isOpen?'closed':tab==='outgoing'?(selectedFilters[tab]==='changes'?'changes':'outgoing'):'incoming');}
if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');
window.addEventListener('resize',fit);initIcons();scene('incoming');fit();
</script>
</body>
