<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRch — interface preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101916;color:#e5e9e6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #a4d0b0;outline-offset:3px}button:disabled{cursor:default}.preview-tools{display:flex;justify-content:center;align-items:center;gap:8px;padding:18px;flex-wrap:wrap;font-size:12px}.preview-tools button{background:#25362e;border:1px solid #43564a;border-radius:7px;padding:7px 12px}.preview-tools button[aria-pressed=true]{background:#456550}.preview-tools span{color:#a2b3a8;margin-right:12px}.scene-wrap{width:680px;max-width:100%;margin:0 auto 24px;overflow:hidden;border-radius:18px}.scene{width:680px;height:748px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 8% 93%,#3d6552 0,transparent 58%),radial-gradient(ellipse at 90% 0%,#466657 0,transparent 55%),linear-gradient(130deg,#172a23,#233c31 65%,#15251e);isolation:isolate}.landscape{position:absolute;inset:0;overflow:hidden;pointer-events:none}.landscape:before{content:"";position:absolute;left:-200px;top:250px;width:1100px;height:650px;border:1px solid #d1e4d014;border-radius:50%;transform:rotate(-27deg);box-shadow:0 35px 0 #d1e4d009,0 75px 0 #d1e4d006,0 120px 0 #d1e4d004}.menubar{height:36px;background:#15241dcc;border-bottom:1px solid #ffffff0e;display:flex;align-items:center;gap:19px;padding:0 19px;font-size:12px;position:relative;z-index:3}.menu-word{font-weight:500}.apple{font-size:17px}.menuspacer{flex:1}.status-trigger{display:flex;align-items:center;gap:7px;font-size:13px;letter-spacing:.1px;border:0;background:#ffffff20;border-radius:5px;padding:5px 9px;height:28px;font-variant-numeric:tabular-nums}.status-trigger[aria-expanded=false]{background:transparent}.status-trigger .separator{opacity:.3;margin:0 1px}.symbol{width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.symbol svg{height:100%;width:100%;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.brand{width:19px;height:19px;background:currentColor;mask:url('../../Resources/Brand/Mark.svg') center/contain no-repeat;-webkit-mask:url('../../Resources/Brand/Mark.svg') center/contain no-repeat;display:inline-block;flex-shrink:0}.clock{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12px}.panel{position:absolute;top:54px;right:55px;width:440px;height:624px;background:#292b29;border:1px solid #ffffff24;border-radius:12px;box-shadow:0 22px 55px #08100bd9,0 4px 14px #08100b77;display:flex;flex-direction:column;z-index:2;transition:opacity .16s,transform .16s;transform-origin:75% 0}.panel:before{content:"";position:absolute;top:-7px;left:var(--anchor-left,257px);width:12px;height:12px;background:#292b29;border-left:1px solid #ffffff24;border-top:1px solid #ffffff24;transform:rotate(45deg)}.panel[hidden]{display:flex;opacity:0;transform:translateY(-7px) scale(.985);pointer-events:none}.header{display:flex;gap:9px;align-items:center;padding:13px 17px}.brand-box{width:28px;height:28px;background:#6da57a12;color:#79af87;border-radius:8px;display:grid;place-items:center}.header-title{font-size:14px;font-weight:600;line-height:18px}.org{font-size:10px;color:#b3b7b3;display:flex;gap:4px;align-items:center;margin-top:3px}.org .symbol{width:10px;height:10px}.head-actions{display:flex;align-items:center;gap:15px;margin-left:auto;color:#b4b8b5}.head-actions .symbol{width:15px;height:15px}.avatar{display:flex;align-items:center;justify-content:center;border-radius:50%;width:20px;height:20px;color:#94ba9d;background:#85aa8c18;font-size:9px;font-weight:500}.tabs{display:flex;gap:22px;margin:0 17px;border-bottom:1px solid #ffffff14}.tab{display:flex;gap:6px;align-items:center;border:0;border-bottom:2px solid transparent;padding:0 0 10px;background:none;color:#afb4af;font-size:11px}.tab[aria-selected=true]{border-color:#79af87;color:#eef1ee;font-weight:600}.tab .symbol{width:13px;height:13px}.tab .count{font-size:9px;padding:2px 4px;border-radius:4px;background:#ffffff09;font-weight:400}.tab[aria-selected=true] .count{background:#8fb49a16;color:#a2c4aa}.filters{display:flex;gap:4px;padding:11px 16px 9px}.filter{background:none;border:0;border-radius:5px;padding:6px 7px;font-size:10px;color:#b4b9b4;white-space:nowrap}.filter[aria-pressed=true]{color:#98c4a2;background:#7fa68a14}.filter .number{font-size:9px;opacity:.75;margin-left:4px}.search{display:flex;align-items:center;gap:6px;margin:0 16px 10px;color:#777f78;font-size:10px}.search .symbol{width:12px;height:12px}.repo-select{margin-left:auto;color:#c4c9c4;background:#4b4e4b;border-radius:4px;padding:3px 7px;display:flex;align-items:center;gap:15px}.repo-select .symbol{width:10px;height:10px}.list{padding:0 8px 8px;flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:#7778 transparent}.group{margin-bottom:7px}.group-header{background:#202320;border-radius:5px;display:flex;align-items:center;gap:5px;color:#c0c7c0;font-size:10px;padding:6px 9px}.group-header .symbol{width:12px;height:12px}.group-header span:last-child{margin-left:auto;color:#788079}.row{height:50px;padding:8px;display:flex;gap:2px;align-items:center}.row-main{flex:1;min-width:0}.row-title{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:500}.row-title .symbol{width:11px;height:11px;color:#80b38c}.pr-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.age{font-size:9px;color:#89918a;white-space:nowrap;font-weight:400}.row-meta{display:flex;gap:6px;align-items:center;padding-left:17px;font-size:9px;margin-top:4px;height:17px;color:#a2aaa3}.pr-number{color:#7d877e}.mini-avatar{font-size:7px;border-radius:50%;background:#5c7c6238;color:#a2c1a9;width:14px;height:14px;display:inline-flex;justify-content:center;align-items:center}.status{margin-left:auto;display:flex;align-items:center;gap:4px;border-radius:4px;padding:3px 5px;font-size:9px;white-space:nowrap}.status .symbol{width:9px;height:9px}.status.waiting,.status.changes{color:#c5a067;background:#b6955416}.status.rereview{color:#8bafc7;background:#7ca4c01a}.status.approved{color:#96bd9d;background:#82aa8a15}.ci{color:#91b99a;font-size:10px}.reviewer{display:inline-flex;align-items:center;gap:3px}.reviewer .symbol{width:9px;height:9px;color:#9bb6a0}.row-chevron{width:14px!important;height:10px!important;color:#717b73;margin-left:4px}.footer{border-top:1px solid #ffffff10;display:flex;align-items:center;gap:5px;padding:10px 16px;color:#a5aea6;font-size:9px;background:#242724;border-radius:0 0 12px 12px}.dot{width:4px;height:4px;border-radius:100%;background:#8eb397}.footer-right{margin-left:auto;display:flex;align-items:center;gap:12px}.footer .symbol{width:11px;height:11px}.demo-label{font-size:8px;letter-spacing:.35px;color:#8d988f}.caption{position:absolute;left:32px;bottom:28px;color:#b6cabb;font-size:11px;display:flex;align-items:center;gap:8px;letter-spacing:.15px}.caption .brand{width:14px;height:14px}.caption .name{font-weight:600;color:#e0eae2}.cursor{position:absolute;z-index:5;left:614px;top:20px;width:21px;height:27px;filter:drop-shadow(0 2px 2px #0008);pointer-events:none}.cursor svg{width:100%;height:100%}.cursor[hidden]{display:none}.empty{font-size:12px;color:#a7b4a9;text-align:center;padding:60px 10px}.capture .panel{transition:none}.mobile-note{display:none}.sr-only{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden} @media(max-width:680px){.scene-wrap{border-radius:0}.scene{transform-origin:0 0}.preview-tools{padding:12px}.preview-tools span{width:100%;text-align:center}}
</style>
</head>
<body>
<nav class="preview-tools" aria-label="Preview scenes"><span>Fictional data · interactive UI illustration</span><button data-scene="closed">Menu bar</button><button data-scene="incoming">Review requests</button><button data-scene="outgoing">My PRs</button><button data-scene="changes">Changes</button><button id="play">▶ Play demo</button></nav>
<div class="scene-wrap"><main class="scene" id="scene" aria-label="PRch opened from the macOS menu bar, using fictional repositories">
<div class="landscape"></div>
<div class="menubar"><span class="apple" aria-hidden="true"></span><span class="menu-word">Finder</span><span>File</span><span>Edit</span><span>View</span><span>Go</span><span class="menuspacer"></span><button class="status-trigger" id="trigger" aria-label="PRch: 6 reviews to do, 1 PR needing changes" aria-expanded="true"><span class="brand"></span><span>↓6</span><span class="separator">│</span><span>↑1</span></button><span class="symbol" data-icon="wifi"></span><span class="symbol" data-icon="battery"></span><span class="clock">Mon 9:41 AM</span></div>
<section class="panel" id="panel" aria-label="PRch review panel">
<header class="header"><div class="brand-box"><span class="brand"></span></div><div><div class="header-title">PRch</div><div class="org"><span class="symbol" data-icon="building"></span>example-org</div></div><div class="head-actions"><span class="symbol" data-icon="refresh" title="Refresh"></span><span class="symbol" data-icon="settings" title="Settings"></span><span class="avatar">YO</span></div></header>
<div class="tabs" role="tablist" aria-label="Pull requests"><button class="tab" id="incoming" role="tab" aria-selected="true"><span class="symbol" data-icon="inbox"></span>Review requests<span class="count">9</span></button><button class="tab" id="outgoing" role="tab" aria-selected="false"><span class="symbol" data-icon="send"></span>My PRs<span class="count">4</span></button></div>
<div class="filters" id="filters" aria-label="Review status"></div>
<div class="search"><span class="symbol" data-icon="search"></span><span>Search PRs…</span><div class="repo-select">All repositories<span class="symbol" data-icon="chevrons"></span></div></div>
<div class="list" id="list" role="tabpanel"></div>
<footer class="footer"><span class="dot"></span>Updated just now<div class="footer-right"><span class="demo-label">DEMO</span><span>GitHub ↗</span><span class="symbol" data-icon="more"></span></div></footer>
</section>
<div class="cursor" id="cursor" aria-hidden="true"><svg viewBox="0 0 22 28"><path d="M2 1.5v21l5.5-5 4.4 9 4.3-2-4.4-8.7h7.4Z" fill="#f4f7f4" stroke="#23352b" stroke-width="1.2"/></svg></div>
<div class="caption"><span class="brand"></span><span class="name">PRch</span><span>Reviews, one click away.</span></div>
</main></div>
<script>
// Hand-authored, fictional demo data. No GitHub requests, account data, or external scripts.
const icons={wifi:'<path d="M2 6a16 16 0 0 1 20 0M5 10a11 11 0 0 1 14 0M9 14a5 5 0 0 1 6 0"/><circle cx="12" cy="18" r="1"/>',battery:'<rect x="2" y="6" width="17" height="12" rx="2"/><path d="M22 10v4M5 9h10v6H5Z"/>',building:'<rect x="4" y="2" width="12" height="20" rx="1"/><path d="M16 9h4v13H4M8 6h1m3 0h1M8 10h1m3 0h1M8 14h1m3 0h1M9 22v-4h3v4"/>',refresh:'<path d="M20 7a8 8 0 1 0 1 9M20 2v6h-6"/>',settings:'<path d="m9 3 1-2h4l1 2 3 2 3 1v4l-2 2 2 2v4l-3 1-3 2-1 2h-4l-1-2-3-2-3-1v-4l2-2-2-2V6l3-1Z"/><circle cx="12" cy="12" r="3"/>',inbox:'<path d="m3 4-2 9v6h22v-6l-3-9ZM1 13h6l2 3h6l2-3h6"/>',send:'<path d="m2 11 20-9-7 20-4-8-9-3ZM11 14 22 2"/>',search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/>',chevrons:'<path d="m8 8 4-4 4 4m-8 8 4 4 4-4"/>',folder:'<path d="M2 6h7l2 3h11v12H2ZM2 6V3h7l2 3h11v3"/>',pr:'<circle cx="6" cy="4" r="2"/><circle cx="18" cy="20" r="2"/><path d="M6 6v16M14 4h2a2 2 0 0 1 2 2v12"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',check:'<path d="m4 12 5 5L20 6"/>',comment:'<path d="M3 3h18v14H8l-5 4ZM12 7v4m0 3h0"/>',more:'<circle cx="4" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="20" cy="12" r="1"/>',right:'<path d="m9 5 7 7-7 7"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.clock}</svg>`;
function initIcons(){document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));}
const incomingPRs=[
{repo:'sample-api',n:26,title:'Add pagination to the list endpoint',by:'alex',age:'2 hr. ago',status:'waiting'},
{repo:'sample-api',n:24,title:'Improve input validation messages',by:'kai',age:'2 hr. ago',status:'approved'},
{repo:'sample-docs',n:16,title:'Expand the setup guide',by:'ren',age:'1 hr. ago',status:'waiting'},
{repo:'sample-docs',n:13,title:'Fix a typo in the code example',by:'sam',age:'1 hr. ago',status:'waiting'},
{repo:'sample-docs',n:9,title:'Reorganize headings and navigation',by:'alex',age:'3 hr. ago',status:'commented'},
{repo:'sample-web',n:35,title:'Fix the empty search state',by:'sam',age:'40 min. ago',status:'rereview'},
{repo:'sample-web',n:42,title:'Remember the list sort order',by:'alex',age:'20 min. ago',status:'waiting'},
{repo:'sample-web',n:38,title:'Add a loading indicator',by:'kai',age:'1 hr. ago',status:'waiting'},
{repo:'sample-web',n:29,title:'Improve keyboard focus styles',by:'ren',age:'3 hr. ago',status:'changes'}];
const outgoingPRs=[
{repo:'sample-api',n:19,title:'Add response format tests',by:'you',age:'4 hr. ago',status:'approved'},
{repo:'sample-docs',n:14,title:'Add frequently asked questions',by:'you',age:'4 hr. ago',status:'waiting'},
{repo:'sample-web',n:31,title:'Adjust footer spacing',by:'you',age:'3 hr. ago',status:'changes'},
{repo:'sample-web',n:40,title:'Document keyboard navigation',by:'you',age:'3 hr. ago',status:'waiting'}];
let tab='incoming',filter='pending',isOpen=true,timers=[];
const panel=document.getElementById('panel'),trigger=document.getElementById('trigger'),cursor=document.getElementById('cursor');
function matches(pr,f){return f==='all'||(f==='pending'?['waiting','rereview'].includes(pr.status):f==='done'?!['waiting','rereview'].includes(pr.status):pr.status===f);}
function render(){
 panel.hidden=!isOpen;panel.inert=!isOpen;panel.setAttribute('aria-hidden',String(!isOpen));trigger.setAttribute('aria-expanded',String(isOpen));
 document.getElementById('incoming').setAttribute('aria-selected',String(tab==='incoming'));document.getElementById('outgoing').setAttribute('aria-selected',String(tab==='outgoing'));
 const source=tab==='incoming'?incomingPRs:outgoingPRs;
 const filters=tab==='incoming'?[['pending','Pending'],['done','Reviewed'],['all','All']]:[['all','All'],['waiting','Waiting'],['changes','Changes'],['approved','Approved'],['unrequested','No request']];
 document.getElementById('filters').innerHTML=filters.map(([id,label])=>`<button class="filter" data-filter="${id}" aria-pressed="${filter===id}">${label}<span class="number">${source.filter(p=>matches(p,id)).length}</span></button>`).join('');
 document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{stop();filter=button.dataset.filter;cursor.hidden=true;render();}));
 const prs=source.filter(p=>matches(p,filter));let content='';
 for(const repo of [...new Set(prs.map(p=>p.repo))]){const group=prs.filter(p=>p.repo===repo);content+=`<section class="group"><div class="group-header"><span class="symbol">${icon('folder')}</span><span>${repo}</span><span>${group.length}</span></div>`;
 for(const pr of group){const label={waiting:tab==='incoming'?'Not reviewed':'Waiting',rereview:'Re-review requested',changes:tab==='incoming'?'Changes requested':'Changes',approved:'Approved',commented:'Commented'}[pr.status];const symbol={waiting:'clock',rereview:'refresh',changes:'comment',approved:'check',commented:'comment'}[pr.status];
 content+=`<article class="row"><div class="row-main"><div class="row-title"><span class="symbol">${icon('pr')}</span><span class="pr-title">${pr.title}</span><span class="age">${pr.age}</span></div><div class="row-meta"><span class="pr-number">#${pr.n}</span>${tab==='incoming'?`<span class="mini-avatar">${pr.by.slice(0,2).toUpperCase()}</span><span>${pr.by}</span>`:`<span class="reviewer">alex <span class="symbol">${icon(pr.status==='changes'?'comment':'check')}</span></span><span class="reviewer">sam <span class="symbol">${icon(pr.status==='approved'?'check':'clock')}</span></span>`}<span class="status ${pr.status}"><span class="symbol">${icon(symbol)}</span>${label}</span>${tab==='outgoing'?`<span class="ci">${pr.status==='changes'?'×':'✓'}</span>`:''}</div></div><span class="symbol row-chevron">${icon('right')}</span></article>`;
 } content+='</section>';}
 document.getElementById('list').innerHTML=content||'<div class="empty">No matching PRs</div>';
 document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===(!isOpen?'closed':tab==='incoming'?'incoming':filter==='changes'?'changes':'outgoing'))));
}
function stop(){timers.forEach(clearTimeout);timers=[];document.getElementById('play').textContent='▶ Play demo';}
function scene(name){isOpen=name!=='closed';tab=['outgoing','changes'].includes(name)?'outgoing':'incoming';filter=name==='changes'?'changes':tab==='incoming'?'pending':'all';cursor.hidden=false;render();align(name);}
document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>{stop();scene(b.dataset.scene);}));
trigger.addEventListener('click',()=>{stop();isOpen=!isOpen;cursor.hidden=true;render();});
document.getElementById('incoming').addEventListener('click',()=>{stop();tab='incoming';filter='pending';cursor.hidden=true;render();});
document.getElementById('outgoing').addEventListener('click',()=>{stop();tab='outgoing';filter='all';cursor.hidden=true;render();});
document.getElementById('play').addEventListener('click',()=>{stop();scene('closed');document.getElementById('play').textContent='Playing…';[['incoming',900],['outgoing',3300],['changes',5600],['incoming',7900]].forEach(([name,delay])=>timers.push(setTimeout(()=>scene(name),delay)));timers.push(setTimeout(stop,10000));});
function align(name){const base=document.getElementById('scene').getBoundingClientRect(),scale=base.width/680;const bar=trigger.getBoundingClientRect(),pop=panel.getBoundingClientRect();panel.style.setProperty('--anchor-left',((bar.x+bar.width/2-pop.x)/scale-6)+'px');const target=name==='outgoing'?document.getElementById('outgoing'):name==='changes'?document.querySelector('[data-filter=changes]'):trigger;const r=target.getBoundingClientRect();cursor.style.left=((r.x+r.width*.68-base.x)/scale)+'px';cursor.style.top=((r.y+r.height*.6-base.y)/scale)+'px';}
function fit(){const width=Math.min(680,document.documentElement.clientWidth);document.getElementById('scene').style.transform=`scale(${width/680})`;document.querySelector('.scene-wrap').style.height=(748*width/680)+'px';align(!isOpen?'closed':tab==='outgoing'?(filter==='changes'?'changes':'outgoing'):'incoming');}
if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');
window.addEventListener('resize',fit);initIcons();scene('incoming');fit();
</script>
</body>
</html>
